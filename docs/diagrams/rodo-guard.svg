<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" role="img" aria-label="Schemat wtyczki RODO Guard: pytanie o anonimizację przed wysłaniem na czat AI, gałąź tak i nie">
  <title>Wtyczka RODO Guard: anonimizacja przed wysłaniem na czat AI</title>
  <defs>
    <marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L7,3 z" fill="#2C6266"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; fill: #1F2A2A; }
    .title { font-size: 17px; font-weight: 600; }
    .item { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .item-sub { font-size: 12px; fill: #5B6666; text-anchor: middle; }
    .footer-text { font-size: 13px; fill: #5B6666; }
    .branch-yes { font-size: 12px; font-weight: 700; fill: #1E7A46; text-anchor: middle; }
    .branch-no { font-size: 12px; font-weight: 700; fill: #5B6666; text-anchor: middle; }
    .decision-text { font-size: 13px; font-weight: 600; fill: #B5650D; text-anchor: middle; }
  </style>

  <rect width="920" height="470" fill="#FFFFFF"/>

  <!-- Tytul -->
  <text x="460" y="36" text-anchor="middle" class="title">Wtyczka RODO Guard: anonimizacja przed wysłaniem na czat AI</text>

  <!-- Krok 1: wklejasz na czacie -->
  <g>
    <rect x="280" y="60" width="360" height="66" rx="10" fill="#F4F6F6" stroke="#DCE3E3"/>
    <text x="460" y="86" class="item">Wklejasz tekst lub upuszczasz plik na czacie AI</text>
    <text x="460" y="108" class="item-sub">Claude, ChatGPT, Gemini</text>
  </g>

  <!-- Strzalka w dol do rombu -->
  <line x1="460" y1="128" x2="460" y2="162" stroke="#2C6266" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Romb decyzyjny -->
  <polygon points="460,168 585,230 460,292 335,230" fill="#FCF0DF" stroke="#B5650D" stroke-width="2"/>
  <text x="460" y="224" class="decision-text">Zanonimizować</text>
  <text x="460" y="244" class="decision-text">przed wysłaniem?</text>

  <!-- Galez TAK: w lewo -->
  <line x1="335" y1="230" x2="170" y2="230" stroke="#2C6266" stroke-width="2"/>
  <line x1="170" y1="230" x2="170" y2="258" stroke="#2C6266" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="252" y="218" class="branch-yes">TAK</text>

  <!-- Galez NIE: w prawo -->
  <line x1="585" y1="230" x2="750" y2="230" stroke="#2C6266" stroke-width="2"/>
  <line x1="750" y1="230" x2="750" y2="258" stroke="#2C6266" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="667" y="218" class="branch-no">NIE</text>

  <!-- TAK: krok 1: daemon -->
  <g>
    <rect x="20" y="262" width="300" height="64" rx="10" fill="#E8F5EC" stroke="#DCE3E3"/>
    <text x="170" y="288" class="item">Lokalny daemon anonimizuje w tle</text>
    <text x="170" y="308" class="item-sub">ten sam silnik co aplikacja desktopowa</text>
  </g>

  <!-- TAK: strzalka dol -->
  <line x1="170" y1="326" x2="170" y2="350" stroke="#2C6266" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- TAK: krok 2: bezpieczna wersja -->
  <g>
    <rect x="20" y="354" width="300" height="64" rx="10" fill="#E8F5EC" stroke="#DCE3E3"/>
    <text x="170" y="380" class="item">W czacie ląduje bezpieczna wersja</text>
    <text x="170" y="400" class="item-sub">[Osoba 1], [PESEL 1] zamiast prawdziwych danych</text>
  </g>

  <!-- NIE: zwykle wklejenie -->
  <g>
    <rect x="600" y="262" width="300" height="64" rx="10" fill="#F4F6F6" stroke="#DCE3E3"/>
    <text x="750" y="288" class="item">Zwykłe wklejenie oryginału</text>
    <text x="750" y="308" class="item-sub">wtyczka nigdy nie blokuje pracy</text>
  </g>

  <!-- Stopka -->
  <rect x="0" y="440" width="920" height="30" fill="#F4F6F6"/>
  <text x="460" y="459" text-anchor="middle" class="footer-text">Wtyczka działa tylko lokalnie: przechwytuje wklejanie, pyta, i edytuje tekst. Nic nigdzie nie wysyła.</text>
</svg>
